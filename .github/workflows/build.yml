
        - name: Accept Android SDK Licenses
          shell: bash
          run: |
            set -euo pipefail
            python3 - "$SDKMANAGER" <<'PY'
            import subprocess
            import sys

            sdkmanager = sys.argv[1]
            answers = "y\n" * 1000

            result = subprocess.run(
                [sdkmanager, "--licenses"],
                input=answers,
                text=True,
                check=False
            )

            if result.returncode != 0:
                print(
                    f"SDK license acceptance failed: "
                    f"exit code {result.returncode}",
                    file=sys.stderr
                )
                sys.exit(result.returncode)

            print("Android SDK license acceptance completed.")
            PY
