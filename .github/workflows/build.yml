
name: LIFEEASY Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifeeasy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: LIFEEASY Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Locate Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK not found: $SDK_ROOT"
            exit 1
          fi

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK Licenses
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SDKMANAGER" <<'PY'
          import subprocess
          import sys

          sdkmanager = sys.argv[1]
          result = subprocess.run(
              [sdkmanager, "--licenses"],
              input="y\n" * 1000,
              text=True,
              check=False
          )

          if result.returncode != 0:
              print(f"License acceptance failed: {result.returncode}")
              sys.exit(result.returncode)

          print("License acceptance completed.")
          PY

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify Environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Validate Version Catalog
        run: |
          python3 -c "import tomllib; tomllib.load(open('gradle/libs.versions.toml','rb')); print('TOML PASS')"

      - name: Run Unit Tests
        run: |
          gradle testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LIFEEASY-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LIFEEASY-Test-Reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          if-no-files-found: warn
          retention-days: 14
