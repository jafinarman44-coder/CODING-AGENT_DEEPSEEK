name: LIFEEASY Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifeeasy-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME}"
          test -d "${ANDROID_HOME}/cmdline-tools"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort | tail -n 1)"
          if [[ -z "${SDKMANAGER}" ]]; then
            echo "::error::Android sdkmanager was not found on this runner."
            exit 1
          fi
          echo "SDKMANAGER=${SDKMANAGER}" >> "${GITHUB_ENV}"
          echo "$(dirname "${SDKMANAGER}")" >> "${GITHUB_PATH}"
          echo "${ANDROID_HOME}/platform-tools" >> "${GITHUB_PATH}"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          sdkmanager = os.environ["SDKMANAGER"]
          result = subprocess.run(
              [sdkmanager, "--licenses"],
              input=("y\n" * 500),
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
          )
          print(result.stdout)
          if result.returncode != 0:
              raise SystemExit(result.returncode)
          PY

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          "${SDKMANAGER}" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          sdkmanager --list_installed

      - name: Run unit tests and build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee "${RUNNER_TEMP}/lifeasy-gradle.log"

      - name: Upload build diagnostics and APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeasy-build-diagnostics
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lifeasy-gradle.log
            **/build/reports/tests/**
            **/build/test-results/**
            app/build/outputs/apk/debug/*.apk
